{% extends 'base.html' %}

{% block content %}
<section class="payment-container">
    <div class="payment-box">
        <h2>Complete Your Payment</h2>
        <div class="payment-details">
            <p><strong>Booking ID:</strong> {{ booking_id }}</p>
            <p><strong>Amount:</strong> ${{ amount }}</p>
        </div>

        <form action="{{ url_for('payment', booking_id=booking_id) }}" method="POST" class="payment-form">
            <div class="form-group">
                <label for="card_number">Card Number</label>
                <input type="text" id="card_number" name="card_number" required maxlength="16" placeholder="1234 5678 9012 3456">
            </div>
            
            <div class="form-group">
                <label for="expiry_date">Expiry Date</label>
                <input type="text" id="expiry_date" name="expiry_date" required placeholder="MM/YY">
            </div>
            
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" required maxlength="3" placeholder="123">
            </div>
            
            <button type="submit" class="payment-button">Submit Payment</button>
        </form>
    </div>
</section>
{% endblock %}
